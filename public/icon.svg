<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pininGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3AA3F7"/>
      <stop offset="100%" stop-color="#2178C9"/>
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Perfectly Round Icon on Transparent Canvas -->
  <circle cx="256" cy="256" r="244" fill="url(#pininGrad)"/>
  
  <!-- Inner Ring Accent -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25"/>

  <!-- PinIn Icon Symbol: Bold "P" and Location Pin Motif -->
  <g filter="url(#subtleGlow)">
    <!-- Primary P Stem and Loop -->
    <path d="M184 136h96c48 0 82 28 82 72s-34 72-82 72h-48v96h-48V136zm48 100h48c24 0 40-12 40-28s-16-28-40-28h-48v56z" fill="#ffffff"/>
    
    <!-- Pin Accent Indicator (In) -->
    <circle cx="360" cy="340" r="30" fill="#ffffff"/>
    <path d="M360 268l18 36h-36z" fill="#ffffff"/>
  </g>
</svg>
