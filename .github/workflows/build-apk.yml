name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Clean old android
        run: rm -rf android
      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5 @capacitor/camera @capacitor/network @capacitor/share --legacy-peer-deps
      - name: Build web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Create Capacitor config
        run: echo '{"appId":"com.pinin.app","appName":"PinIn","webDir":"dist"}' > capacitor.config.json
      - name: Add Android platform fresh
        run: |
          npx @capacitor/cli add android
          npx @capacitor/cli copy android
      - name: Fix compileSdk and Gradle
        run: |
          sed -i "s/compileSdkVersion = .*/compileSdkVersion = 36/" android/variables.gradle
          sed -i "s/targetSdkVersion = .*/targetSdkVersion = 36/" android/variables.gradle
          sed -i "s/com.android.tools.build:gradle:.*/com.android.tools.build:gradle:8.9.1/" android/build.gradle
          sed -i "s/gradle-.*-all.zip/gradle-8.11-all.zip/" android/gradle/wrapper/gradle-wrapper.properties
      - name: Force old androidx core
        run: |
          echo "configurations.all { resolutionStrategy { force 'androidx.core:core:1.12.0'; force 'androidx.core:core-ktx:1.12.0' } }" >> android/app/build.gradle
      - name: Generate icons and splash
        run: |
          npm install @capacitor/assets --save-dev --legacy-peer-deps
          npx capacitor-assets generate --android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/debug/app-debug.apk
