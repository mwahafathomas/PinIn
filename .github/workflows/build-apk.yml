name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Clean old android
        run: rm -rf android
      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5
      - name: Build web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Create Capacitor config
        run: echo '{"appId":"com.pinin.app","appName":"PinIn","webDir":"dist"}' > capacitor.config.json
      - name: Add Android platform fresh
        run: |
          npx @capacitor/cli add android
          npx @capacitor/cli copy android
      - name: Generate icons and splash
        run: |
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pinin-apk
          path: android/app/build/outputs/apk/debug/*.apk
