<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PinIn</title>
    <meta name="description" content="PinIn is your local marketplace to buy, sell, and discover pre-loved and handcrafted furniture." />
    <meta property="og:title" content="PinIn" />
    <meta property="og:description" content="Buy, sell, and discover local furniture listings." />
    <meta name="theme-color" content="#2D8EDE" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PinIn" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- OneSignal Web SDK v16 -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        try {
          await OneSignal.init({
            appId: "47242cd4-ecdc-4348-82aa-0274bee57d27",
            notifyButton: { enable: false },
            allowLocalhostAsSecureOrigin: true,
          });
        } catch (e) {
          // Gracefully ignore iframe permission / sandbox restrictions
        }
      });
    </script>
    <style>
      /* Ensure pure white background across all containers to eliminate jump/flash on resume */
      html, body, #root {
        background-color: #ffffff !important;
      }
      /* Hide scrollbars globally across the entire app for all browsers */
      *, *::before, *::after, html, body, #root {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
      *::-webkit-scrollbar,
      html::-webkit-scrollbar,
      body::-webkit-scrollbar,
      #root::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
        background: transparent !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
